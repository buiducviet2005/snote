      window.google = {
        script: {
          run: {
            withSuccessHandler: function(successCb) {
              this._success = successCb;
              return this;
            },
            withFailureHandler: function(failCb) {
              this._fail = failCb;
              return this;
            },
            getPublicProjectsList: function() {
              const res = { success: true, projects: mockDatabase.projects };
              setTimeout(() => { if (this._success) this._success(res); }, 80);
            },
            accessProjectPortal: function(pId, pin) {
              const p = mockDatabase.projects.find(x => x.projectId === pId);
              if (!p) {
                setTimeout(() => { if (this._success) this._success({ success: false, message: 'Không tìm thấy đồ án!' }); }, 80);
                return;
              }
              if (p.pinCode !== pin) {
                setTimeout(() => { if (this._success) this._success({ success: false, message: 'Mã PIN đồ án không đúng!' }); }, 80);
                return;
              }
              const tasks = mockDatabase.tasks.filter(t => t.projectId === pId);
              const notes = mockDatabase.notes.filter(n => n.projectId === pId);
              const roadmaps = mockDatabase.roadmaps.filter(r => r.projectId === pId);
              const res = { success: true, project: p, projects: mockDatabase.projects, tasks: tasks, notes: notes, roadmaps: roadmaps };
              setTimeout(() => { if (this._success) this._success(res); }, 80);
            },
            handleAdminLogin: function(email, pass) {
              if (email === 'admin@gmail.com' && pass === '123456') {
                const res = { success: true, sessionToken: 'LOCAL-MOCK-TOKEN-999', fullName: 'Quản Trị Viên SNOTE', email: email };

              } else {
                setTimeout(() => { if (this._success) this._success({ success: false, message: 'Sai email hoặc mật khẩu admin!' }); }, 80);
              }
            },
            verifySessionToken: function(tok) {
              const valid = tok === 'LOCAL-MOCK-TOKEN-999';
              const res = JSON.stringify({ valid: valid, email: 'admin@gmail.com', fullName: 'Quản Trị Viên SNOTE' });
              setTimeout(() => { if (this._success) this._success(res); }, 50);
            },
            updateTaskStatus: function(pId, tId, newStatus) {
              const t = mockDatabase.tasks.find(x => x.taskId === tId);
              if (t) {
                t.status = newStatus;
                if (newStatus === 'DONE') {
                  t.completedAt = new Date().toISOString().substring(0, 10);
                  t.evaluation = (!t.dueDate || t.completedAt <= t.dueDate) ? 'Đúng hạn' : 'Trễ hạn';
                } else {
                  t.completedAt = '';
                  t.evaluation = '';
                }
                setTimeout(() => { if (this._success) this._success({ success: true, taskId: tId, status: newStatus, completedAt: t.completedAt, evaluation: t.evaluation }); }, 50);
              }
            },
            saveTask: function(auth, jsonStr) {
              const t = JSON.parse(jsonStr);
              if (!t.taskId) t.taskId = 'TASK-' + (1000 + mockDatabase.tasks.length + 1);
              const idx = mockDatabase.tasks.findIndex(x => x.taskId === t.taskId);
              if (idx >= 0) mockDatabase.tasks[idx] = t;
              else mockDatabase.tasks.unshift(t);
              setTimeout(() => { if (this._success) this._success({ success: true, taskId: t.taskId, task: t }); }, 80);
            },
            updateTaskChecklist: function(auth, tId, chksStr) {
              const t = mockDatabase.tasks.find(x => x.taskId === tId);
              if (t) t.checklists = JSON.parse(chksStr);
              setTimeout(() => { if (this._success) this._success({ success: true, taskId: tId }); }, 50);
            },
            saveNote: function(auth, jsonStr) {
              const n = JSON.parse(jsonStr);
              if (!n.noteId) n.noteId = 'NOTE-' + (100 + mockDatabase.notes.length + 1);
              n.createdAt = new Date().toISOString().substring(0, 10);
              const idx = mockDatabase.notes.findIndex(x => x.noteId === n.noteId);
              if (idx >= 0) mockDatabase.notes[idx] = n;
              else mockDatabase.notes.unshift(n);
              setTimeout(() => { if (this._success) this._success({ success: true, noteId: n.noteId, note: n }); }, 80);
            },
                        deleteNote: function(auth, noteId) {
              const cleanNid = String(noteId || '').trim();
              mockDatabase.notes = mockDatabase.notes.filter(x => x.noteId !== cleanNid);
              setTimeout(() => { if (this._success) this._success({ success: true, noteId: cleanNid }); }, 50);
            },
            deleteTask: function(auth, taskId) {
              const cleanTid = String(taskId || '').trim();
              mockDatabase.tasks = mockDatabase.tasks.filter(x => x.taskId !== cleanTid);
              setTimeout(() => { if (this._success) this._success({ success: true, taskId: cleanTid }); }, 50);
            },
            deleteRoadmap: function(auth, roadmapId) {
              const cleanRid = String(roadmapId || '').trim();
              mockDatabase.roadmaps = mockDatabase.roadmaps.filter(x => x.roadmapId !== cleanRid);
              setTimeout(() => { if (this._success) this._success({ success: true, roadmapId: cleanRid }); }, 50);
            },
            executeBatchSync: function(payloadStr) {
              try {
                const payload = typeof payloadStr === 'string' ? JSON.parse(payloadStr) : payloadStr;
                const ops = payload.operations || [];
                const results = [];
                ops.forEach((op, idx) => {
                  const table = String(op.table || '').toUpperCase();
                  const action = String(op.action || '').toUpperCase();
                  const data = op.data || {};
                  if (table === 'TASKS') {
                    if (action === 'SAVE') {
                      if (!data.taskId) data.taskId = 'TASK-' + (1000 + mockDatabase.tasks.length + 1);
                      const i = mockDatabase.tasks.findIndex(x => x.taskId === data.taskId);
                      if (i >= 0) mockDatabase.tasks[i] = data; else mockDatabase.tasks.unshift(data);
                      results.push({ opId: idx, success: true });
                    } else if (action === 'STATUS') {
                      const t = mockDatabase.tasks.find(x => x.taskId === op.taskId);
                      if (t) {
                        t.status = op.status;
                        if (op.status === 'DONE') {
                          t.completedAt = new Date().toISOString().substring(0, 10);
                          t.evaluation = (!t.dueDate || t.completedAt <= t.dueDate) ? 'Đúng hạn' : 'Trễ hạn';
                        }
                      }
                      results.push({ opId: idx, success: true });
                    } else if (action === 'CHECKLIST') {
                      const t = mockDatabase.tasks.find(x => x.taskId === op.taskId);
                      if (t) t.checklists = op.checklists || [];
                      results.push({ opId: idx, success: true });
                    } else if (action === 'DELETE') {
                      mockDatabase.tasks = mockDatabase.tasks.filter(x => x.taskId !== op.taskId);
                      results.push({ opId: idx, success: true });
                    }
                  } else if (table === 'NOTES') {
                    if (action === 'SAVE') {
                      if (!data.noteId) data.noteId = 'NOTE-' + (100 + mockDatabase.notes.length + 1);
                      data.createdAt = data.createdAt || new Date().toISOString().substring(0, 10);
                      const i = mockDatabase.notes.findIndex(x => x.noteId === data.noteId);
                      if (i >= 0) mockDatabase.notes[i] = data; else mockDatabase.notes.unshift(data);
                      results.push({ opId: idx, success: true });
                    } else if (action === 'PIN') {
                      const n = mockDatabase.notes.find(x => x.noteId === op.noteId);
                      if (n) n.isPinned = !n.isPinned;
                      results.push({ opId: idx, success: true });
                    } else if (action === 'DELETE') {
                      mockDatabase.notes = mockDatabase.notes.filter(x => x.noteId !== op.noteId);
                      results.push({ opId: idx, success: true });
                    }
                  } else if (table === 'ROADMAPS') {
                    if (action === 'SAVE') {
                      if (!data.roadmapId) data.roadmapId = 'RDM-' + (100 + mockDatabase.roadmaps.length + 1);
                      data.createdAt = data.createdAt || new Date().toISOString().substring(0, 10);
                      const i = mockDatabase.roadmaps.findIndex(x => x.roadmapId === data.roadmapId);
                      if (i >= 0) mockDatabase.roadmaps[i] = data; else mockDatabase.roadmaps.unshift(data);
                      results.push({ opId: idx, success: true });
                    } else if (action === 'DELETE') {
                      mockDatabase.roadmaps = mockDatabase.roadmaps.filter(x => x.roadmapId !== op.roadmapId);
                      results.push({ opId: idx, success: true });
                    }
                  }
                });
                setTimeout(() => { if (this._success) this._success({ success: true, count: ops.length, results: results }); }, 50);
              } catch (err) {
                setTimeout(() => { if (this._failure) this._failure(err); else if (this._success) this._success({ success: false, message: err.message }); }, 50);

                  projectId: n.projectId,
                  title: '[Ghi Chú] ' + n.title,
                  priority: 'MEDIUM',
                  status: 'TODO',
                  dueDate: due.toISOString().substring(0, 10),
                  checklists: [],
                  categoryField: 'Notes Sync'

                mockDatabase.tasks.unshift(newTask);
                setTimeout(() => { if (this._success) this._success({ success: true, task: newTask }); }, 80);

              const r = JSON.parse(jsonStr);
              if (!r.roadmapId) r.roadmapId = 'RDM-' + (100 + mockDatabase.roadmaps.length + 1);
              r.createdAt = new Date().toISOString().substring(0, 10);
              mockDatabase.roadmaps.unshift(r);
              setTimeout(() => { if (this._success) this._success({ success: true, roadmap: r }); }, 80);
            },
            convertBatchRoadmapToTasks: function(auth, pId, rId) {
              const r = mockDatabase.roadmaps.find(x => x.roadmapId === rId) || mockDatabase.roadmaps[0];
              let added = 0;
              (r.milestones || []).forEach(m => {
                (m.goals || []).forEach(g => {
                  added++;
                  const due = new Date();
                  due.setDate(due.getDate() + (g.days || 5));
                  mockDatabase.tasks.unshift({
                    taskId: 'TASK-' + (1000 + mockDatabase.tasks.length + 1),
                    projectId: pId,
                    title: g.title,
                    priority: g.priority || 'MEDIUM',
                    status: 'TODO',
                    dueDate: due.toISOString().substring(0, 10),
                    checklists: (g.checklists || []).map(txt => ({ text: txt, completed: false })),
                    categoryField: m.phaseName
                  });
                });
              });
              const resTasks = mockDatabase.tasks.filter(t => t.projectId === pId);
              setTimeout(() => { if (this._success) this._success({ success: true, message: `Đã chuyển đổi thành công ${added} công việc!`, tasks: resTasks }); }, 100);
            },

              const res = {

                fullName: 'Quản Trị Viên SNOTE (Local Test)',
                email: 'admin@gmail.com',
                projects: mockDatabase.projects,
                tasks: mockDatabase.tasks,
                notes: mockDatabase.notes,
                roadmaps: mockDatabase.roadmaps,
                semesters: [{ semesterId: 'SEM-1', semesterName: 'Học Kỳ 1 (2026 - 2027)' }],
                subjects: [{ subjectId: 'SUB-101', subjectName: 'Phát Triển Ứng Dụng Web', subjectCode: 'INT3306' }]

              setTimeout(() => { if (this._success) this._success(res); }, 80);
            },
            saveProject: function(tok, jsonStr) {
              const p = JSON.parse(jsonStr);
              if (!p.projectId) p.projectId = 'PRJ-' + (100 + mockDatabase.projects.length + 1);
              const idx = mockDatabase.projects.findIndex(x => x.projectId === p.projectId);
              if (idx >= 0) mockDatabase.projects[idx] = p;
              else mockDatabase.projects.push(p);
              setTimeout(() => { if (this._success) this._success({ success: true, project: p }); }, 80);
            },
            deleteProject: function(tok, pId) {
              mockDatabase.projects = mockDatabase.projects.filter(x => x.projectId !== pId);
              mockDatabase.tasks = mockDatabase.tasks.filter(x => x.projectId !== pId);
              mockDatabase.notes = mockDatabase.notes.filter(x => x.projectId !== pId);
              mockDatabase.roadmaps = mockDatabase.roadmaps.filter(x => x.projectId !== pId);
              setTimeout(() => { if (this._success) this._success({ success: true }); }, 80);
            },
            cleanSampleDatabase: function(tok) {
              mockDatabase.tasks = [];
              mockDatabase.notes = [];
              setTimeout(() => { if (this._success) this._success({ success: true }); }, 80);
            },
            exportBackupJsonData: function(tok) {
              const data = {
                app: 'SNOTE Web Script Edition (Mock Export)',
                exportedAt: new Date().toISOString(),
                projects: mockDatabase.projects,
                tasks: mockDatabase.tasks,
                notes: mockDatabase.notes,
                roadmaps: mockDatabase.roadmaps
              };
              setTimeout(() => { if (this._success) this._success({ success: true, json: JSON.stringify(data) }); }, 80);
