version: '3.9'

services:
  # 1. Cơ sở dữ liệu PostgreSQL Production
  postgres_db:
    image: postgres:16-alpine
    container_name: snote_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-snote_prod_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeThisToSuperStrongPassword2026}
      POSTGRES_DB: ${POSTGRES_DB:-snote_prod_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - snote_prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - snote_network

  # 2. Backend API Node.js Express Server
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: snote_prod_backend
    restart: always
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-snote_prod_user}:${POSTGRES_PASSWORD:-ChangeThisToSuperStrongPassword2026}@postgres_db:5432/${POSTGRES_DB:-snote_prod_db}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: "15m"
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: "7d"
      CORS_ORIGIN: ${CORS_ORIGIN:-https://snote.yourdomain.com}
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - snote_network

volumes:
  snote_prod_postgres_data:
    name: snote_prod_postgres_data

networks:
  snote_network:
    name: snote_network
    driver: bridge
